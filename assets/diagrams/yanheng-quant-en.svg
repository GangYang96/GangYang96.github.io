<rect x="40" y="153" width="280" height="260" rx="15" fill="white" stroke="#d7e3ee"/><text x="64" y="198" font-size="25" font-weight="650" fill="#246a91">1. Public samples</text><circle cx="67" cy="248" r="4" fill="#4a8996"/><text x="82" y="255" font-size="21" fill="#41576c">Stocks · ETF · indices</text><circle cx="67" cy="305" r="4" fill="#4a8996"/><text x="82" y="312" font-size="21" fill="#41576c">Source + time + hash</text><circle cx="67" cy="362" r="4" fill="#4a8996"/><text x="82" y="369" font-size="21" fill="#41576c">Separate price bases</text><path d="M327 283 h24 l-6 -6 m6 6 l-6 6" fill="none" stroke="#5a869e" stroke-width="3"/><rect x="360" y="153" width="280" height="260" rx="15" fill="white" stroke="#d7e3ee"/><text x="384" y="198" font-size="25" font-weight="650" fill="#246a91">2. Upstream engines</text><circle cx="387" cy="248" r="4" fill="#4a8996"/><text x="402" y="255" font-size="21" fill="#41576c">Normalize + compute</text><circle cx="387" cy="305" r="4" fill="#4a8996"/><text x="402" y="312" font-size="21" fill="#41576c">Strategy + trade costs</text><circle cx="387" cy="362" r="4" fill="#4a8996"/><text x="402" y="369" font-size="21" fill="#41576c">Next-day execution</text><path d="M647 283 h24 l-6 -6 m6 6 l-6 6" fill="none" stroke="#5a869e" stroke-width="3"/><rect x="680" y="153" width="280" height="260" rx="15" fill="white" stroke="#d7e3ee"/><text x="704" y="198" font-size="25" font-weight="650" fill="#246a91">3. Compare results</text><circle cx="707" cy="248" r="4" fill="#4a8996"/><text x="722" y="255" font-size="21" fill="#41576c">Direct service call</text><circle cx="707" cy="305" r="4" fill="#4a8996"/><text x="722" y="312" font-size="21" fill="#41576c">HTTP worker run</text><circle cx="707" cy="362" r="4" fill="#4a8996"/><text x="722" y="369" font-size="21" fill="#41576c">Trades + equity match</text>
