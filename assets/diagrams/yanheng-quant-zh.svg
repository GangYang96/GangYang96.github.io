<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">研衡量化 · 从数据到策略验证</title><desc id="desc">公开样本采集、上游策略引擎执行与结果复现核验。</desc>
<rect width="1000" height="640" fill="#f3f7fb"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif">
<rect x="40" y="31" width="5" height="30" rx="2" fill="#246a91"/><text x="59" y="56" font-size="32" font-weight="650" fill="#18354b">研衡量化 · 从数据到策略验证</text>
<text x="40" y="96" font-size="22" fill="#5b7185">A 股 / ETF 研究 · 半导体为首批验证板块</text>
<rect x="40" y="153" width="280" height="260" rx="15" fill="white" stroke="#d7e3ee"/><text x="64" y="198" font-size="25" font-weight="650" fill="#246a91">1. 公开数据样本</text><circle cx="67" cy="248" r="4" fill="#4a8996"/><text x="82" y="255" font-size="21" fill="#41576c">股票 · ETF · 指数</text><circle cx="67" cy="305" r="4" fill="#4a8996"/><text x="82" y="312" font-size="21" fill="#41576c">来源、时间与数据哈希</text><circle cx="67" cy="362" r="4" fill="#4a8996"/><text x="82" y="369" font-size="21" fill="#41576c">区分原始与复权价格</text><path d="M327 283 h24 l-6 -6 m6 6 l-6 6" fill="none" stroke="#5a869e" stroke-width="3"/><rect x="360" y="153" width="280" height="260" rx="15" fill="white" stroke="#d7e3ee"/><text x="384" y="198" font-size="25" font-weight="650" fill="#246a91">2. 复用上游引擎</text><circle cx="387" cy="248" r="4" fill="#4a8996"/><text x="402" y="255" font-size="21" fill="#41576c">归一化与指标计算</text><circle cx="387" cy="305" r="4" fill="#4a8996"/><text x="402" y="312" font-size="21" fill="#41576c">策略信号与交易成本</text><circle cx="387" cy="362" r="4" fill="#4a8996"/><text x="402" y="369" font-size="21" fill="#41576c">下一交易日成交</text><path d="M647 283 h24 l-6 -6 m6 6 l-6 6" fill="none" stroke="#5a869e" stroke-width="3"/><rect x="680" y="153" width="280" height="260" rx="15" fill="white" stroke="#d7e3ee"/><text x="704" y="198" font-size="25" font-weight="650" fill="#246a91">3. 结果一致性核验</text><circle cx="707" cy="248" r="4" fill="#4a8996"/><text x="722" y="255" font-size="21" fill="#41576c">服务直接调用</text><circle cx="707" cy="305" r="4" fill="#4a8996"/><text x="722" y="312" font-size="21" fill="#41576c">HTTP 子进程执行</text><circle cx="707" cy="362" r="4" fill="#4a8996"/><text x="722" y="369" font-size="21" fill="#41576c">核对交易与净值序列</text>
<rect x="40" y="445" width="920" height="68" rx="12" fill="#e4f2ee"/>
<text x="63" y="488" font-size="24" fill="#267465">4,955 条日线 · 72 条财报表记录 · 两条执行路径对比</text>
<text x="40" y="556" font-size="21" fill="#5b7185">财报样本已采集，尚未作为策略输入。</text>
<path d="M40 590 H960" stroke="#d7e3ee"/><text x="40" y="624" font-size="20" fill="#5b7185">开源二次开发 · Tick Stock Panel（MIT）· 验证日期 2026-11-01</text>
</g></svg>
